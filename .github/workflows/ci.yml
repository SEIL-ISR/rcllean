name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rmw: [rmw_fastrtps_cpp, rmw_cyclonedds_cpp]
    env:
      RMW_IMPLEMENTATION: ${{ matrix.rmw }}
      # GitHub's runners export PSModulePath, which colcon's PowerShell
      # extension reads as "launched from PowerShell".  It then derives each
      # package's environment through pwsh and loses every ament hook, so the
      # interface packages would build without Lean bindings.
      COLCON_EXTENSION_BLOCKLIST: colcon_core.shell.powershell
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS 2 Jazzy
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install extra ROS packages
        run: |
          sudo apt-get install -y \
            ros-jazzy-rmw-cyclonedds-cpp python3-colcon-common-extensions \
            python3-vcstool

      - name: Install colcon-ros-lake
        run: |
          python3 -m pip install --user "git+https://github.com/SEIL-ISR/colcon-ros-lake"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Fetch the generator and the interface sources
        run: vcs import deps < jazzy.repos

      - name: Cache the Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('rcllean/lean-toolchain') }}

      - name: Install elan
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache the colcon build tree
        uses: actions/cache@v4
        with:
          path: build
          key: >-
            colcon-${{ runner.os }}-${{ matrix.rmw }}-${{ hashFiles(
            'rcllean/**', 'jazzy.repos') }}
          restore-keys: colcon-${{ runner.os }}-${{ matrix.rmw }}-

      # rosidl_core_generators, built from source, group-depends on
      # rosidl_generator_packages, which orders the generator before every
      # interface package.
      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-up-to rcllean --event-handlers console_direct+

      - name: Test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select rcllean --event-handlers console_direct+
          colcon test-result --verbose

      # The interface packages rcllean imports are found through the
      # workspace's environment hooks, so this runs against the install tree.
      - name: Lake alone
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          cd rcllean && lake build && lake test

      - name: Keep the colcon logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: colcon-logs-${{ matrix.rmw }}
          path: log/
